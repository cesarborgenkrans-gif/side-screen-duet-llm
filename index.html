<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duet · Tsuki &amp; Selene</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="app">

    <!-- ══ TOP BAR ══ -->
    <header class="topbar">
      <div class="brand">🎭 DUET <span>// tsuki × selene · 🔊 voice</span></div>
      <div class="right">
        <select id="lang-select" class="lang-select" title="Interface & voice language"></select>
        <span id="vram" class="vram off" title="">VRAM —</span>
        <span id="conn" class="conn checking" title="">◐ checking…</span>
        <button id="screen-toggle" class="ghost" title="Move to main screen">🖥 <span id="screen-toggle-label">main screen</span></button>
        <button id="gear" class="ghost" title="LLM and voice settings">⚙ <span data-i18n="settings">settings</span></button>
      </div>
    </header>

    <div id="filebanner" class="filebanner" hidden></div>

    <section id="settings" class="settings" hidden>
      <label><span data-i18n="provider">LLM provider</span>
        <select id="cfg-provider">
          <option value="lmstudio">LM Studio (local)</option>
          <option value="ollama">Ollama (local)</option>
          <option value="openrouter">OpenRouter (cloud)</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label><span data-i18n="lmurl">LM Studio Base URL</span><input id="cfg-url" type="text" placeholder="http://localhost:1234/v1"></label>
      <label><span data-i18n="model">Model (optional)</span><input id="cfg-model" type="text" placeholder="(uses the loaded model)"></label>
      <label><span data-i18n="temp">Temperature</span><input id="cfg-temp" type="number" min="0" max="2" step="0.1" value="0.7"></label>
      <label><span data-i18n="apikey">API Key (any, for local)</span><input id="cfg-key" type="text" placeholder="lm-studio"></label>
      <label><span data-i18n="voiceurl">Voice server URL</span><input id="cfg-voice-url" type="text" placeholder="http://localhost:3113"></label>
      <label class="chk"><input id="cfg-voice-on" type="checkbox"> <span data-i18n="voiceon">🔊 Voice output (auto-play)</span></label>
      <div class="row-actions">
        <button id="cfg-save" class="primary" data-i18n="save">Save &amp; test connection</button>
        <span id="cfg-status" class="muted"></span>
      </div>
    </section>

    <!-- ══ MASCOT STAGE ══ -->
    <section class="stage">
      <div class="mascot tsuki" id="tsuki-stage">
        <div class="bubble tsuki-bubble" id="tsuki-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="sprite" id="tsuki-sprite"></div>
        <div class="mascot-name tsuki-name">🛰️ TSUKI</div>
      </div>
      <div class="vs">⟷</div>
      <div class="mascot selene" id="selene-stage">
        <div class="bubble selene-bubble" id="selene-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="sprite" id="selene-sprite"></div>
        <div class="mascot-name selene-name">🌙 SELENE</div>
      </div>
    </section>

    <!-- ══ DISCUSSION LOG (VS Code editor styled) ══ -->
    <section class="logwrap">
      <div class="log-head">
        <span>&gt; ORCHESTRATION_LOG.md</span>
        <span class="log-tag" id="log-tag"></span>
      </div>
      <div class="log" id="log"></div>
    </section>

    <!-- ══ SOURCE + MODES + CONTROLS ══ -->
    <section class="console">
      <label class="src-label" data-i18n="srclabel">SOURCE — paste a "Copy as path" file (doc / code / image) or raw text</label>
      <textarea id="src-input" class="src-input" rows="2" data-i18n-ph="srcph" placeholder='Paste text directly, or paste a local file path'></textarea>
      <div class="src-row">
        <button id="btn-load" class="ghost">📎 <span data-i18n="load">Load source</span></button>
        <span id="src-chip" class="src-chip"></span>
      </div>

      <div class="modes" id="modes">
        <button class="mode" data-mode="roast">🔥 <span data-i18n="m_roast">Roast</span></button>
        <button class="mode" data-mode="duel">⚖️ <span data-i18n="m_duel">Academic Duel</span></button>
        <button class="mode" data-mode="skit">🎬 <span data-i18n="m_skit">Comedy Skit</span></button>
        <button class="mode" data-mode="deepdive">🔍 <span data-i18n="m_deepdive">Deep Dive</span></button>
      </div>

      <div class="run-row">
        <label class="turns-label"><span data-i18n="turns">turns</span>
          <input id="turns" type="number" min="2" max="12" step="2" value="6">
        </label>
        <button id="btn-run" class="primary big">▶ <span data-i18n="run">Start the duet</span></button>
        <button id="btn-stop" class="ghost" hidden>■ <span data-i18n="stop">Stop</span></button>
      </div>

      <div class="status-bar">
        <span id="status" class="status"></span>
      </div>
    </section>

    <!-- ══ CREDITS (house protocol) ══ -->
    <footer class="credits">
      <span>© 2026 Cesar Borgenkrans · SparkleSnap</span>
      <span class="sep">·</span>
      <a class="credit-link" data-url="https://sparklesnap.dev">sparklesnap.dev</a>
      <span class="sep">·</span>
      <a class="credit-link" data-url="https://github.com/cesarborgenkrans-gif">github.com/cesarborgenkrans-gif</a>
    </footer>

  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
